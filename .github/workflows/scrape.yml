name: Fetch and Update Stream JSON

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch:

jobs:
  fetch-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Run scraper
        run: node scraper/index.js

      - name: Commit and push stream.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          cp scraper/stream.json stream.json
          git add stream.json

          if ! git diff --cached --quiet; then
            git commit -m "📥 Auto update stream.json"
            git push
          else
            echo "✅ No changes"
          fi
